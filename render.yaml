services:
  - type: web
    name: regional-finance-loan-flow-prototype
    runtime: static
    buildCommand: rm -rf dist && mkdir -p dist && cp -R assets dist/assets && npx --yes pagecrypt@7.1.0 index.html dist/index.html "$PASSWORD"
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    # Every push shows up right away: no CDN or browser caching (Render's default keeps pages up to 5 minutes).
    # Render's static hosting keeps files a later deploy no longer has; send removed agent pages to the agent-copy home.
    routes:
      - type: redirect
        source: /assets/agents/prequal-email-code/*
        destination: /assets/agents/index.html
      - type: redirect
        source: /assets/agents/prequal-no-phone/*
        destination: /assets/agents/index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache