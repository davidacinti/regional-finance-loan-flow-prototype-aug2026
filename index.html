case'offerCode':h=`<div class="offer-hero" role="img" aria-label="Customer using a mobile phone"></div><div class="body center offer-landing-body"><img class="landing-logo" src="https://myloan.regionalfinance.com/images/regional/RMC_Logo.png" alt="Regional Finance"><h1 class="title">You’re minutes away from<br>getting up to <span class="blue">$15,000</span><sup class="fs-6">1</sup></h1><p class="sub text-dark">Easy application. Fast decision.<br>Money when you need it.</p><p class="fine text-center fst-italic">Checking your offer won’t impact your credit score.</p><div class="promo-grid my-4"><div class="promo-card">Instant funding<br>available<sup>2</sup></div><div class="promo-card">Predictable monthly<br>payments</div></div><label class="visually-hidden" for="reservationNumber">Reservation number</label><input id="reservationNumber" class="form-control form-control-lg mb-3" placeholder="Enter your reservation number" autocomplete="off"><div class="legal-check mb-3"><span class="boxcheck"></span><span>I have read and agreed to the: <u><b>Terms of Use</b></u>, <u><b>Privacy Policy</b></u>, <u><b>ESIGN Act Consent</b></u> and <u><b>Credit Profile Authorization</b></u>. These materials include important information so please review them before advancing to the next stage of our digital loan process.</span></div>${btn('Get started','confirmPhone')}<h2 class="procedure-title">IMPORTANT INFORMATION ABOUT PROCEDURES</h2><p class="procedure-copy">To help the government fight the funding of terrorism and money laundering activities, Federal law requires all financial institutions to obtain, verify, and record information that identifies each person who opens an account. What this means for you: When you open an account, we will ask for your name, address, date of birth, and other information that will allow us to identify you. We may also ask to see your driver’s license or other identifying documents.</p><div class="footnote-card"><ol class="mb-0 ps-3"><li class="mb-3">Loans are subject to credit approval. Certain restrictions and conditions apply. Refer to the “Terms and conditions” disclosure in the solicitation you received for more details. <b>If you have a Credit Freeze on your credit report please have it lifted before applying.</b></li><li>Instant funding is available only for eligible borrowers and participating bank accounts. Timing may vary.</li></ol></div></div>${footer}`;break;

case'processing':h=`<div class="body center loading"><div class="spinner"></div><h1 class="title fs-4">Processing your application.</h1><p class="sub">This process may take a few moments. Do not refresh or close this page.</p></div>${footer}`;setTimeout(()=>S.page==='processing'&&go('funding'),1200);break;
case'funding':h=`${step(2)}<div class="body center"><span class="pill">Your approval expires on 03/15/2026*</span><h1 class="title mt-3">Where should we send your ${money(S.amount)}?</h1><p>Start by reviewing your loan terms, then choose the account where you’d like your funds deposited.</p><div class="fake-input my-4 fs-5">Loan Details <i class="bi bi-chevron-down float-end"></i><div class="fine">${money(S.amount)} · ${S.term} ${S.term===1?'year':'years'} · ${monthly()}/month</div></div><div class="account" data-account="Standard Checking"><i class="bi bi-bank bank-icon"></i><div><b>Standard Checking</b><br><small>-1234</small></div><span class="radio"></span></div><div class="account" data-account="Reserved Checking"><i class="bi bi-bank bank-icon"></i><div><b>Reserved Checking</b><br><small>-9876</small></div><span class="radio"></span></div>${btn('Confirm','sign')}<a class="d-inline-flex align-items-center gap-2 mt-4 blue text-decoration-none" href="#"><i class="bi bi-download"></i><b>Credit Score Disclosure</b></a></div>${footer}`;break;
case'sign':h=`${step(3)}<div class="body center"><h1 class="title">Review and sign your agreement</h1><div class="agreement"><div class="paper"><div class="paperhead"><b>LOAN AGREEMENT</b><span class="float-end">1 of 6</span></div><div class="paperbody"><b>PERSONAL INSTALLMENT LOAN AGREEMENT</b><div class="offer-row"><span>Borrower</span><b>${esc(fullName())}</b></div><div class="offer-row"><span>Amount financed</span><b>${money(S.amount)}</b></div><div class="offer-row"><span>Annual percentage rate</span><b>${aprFor(S.term).toFixed(2)}%</b></div><div class="offer-row"><span>Term</span><b>${S.term*12} months</b></div><div class="offer-row"><span>Monthly payment</span><b>${monthly()}</b></div><p class="mt-3">Borrower promises to pay Lender the Amount Financed plus interest in ${S.term*12} consecutive monthly installments.</p><div class="signature">SIGN &nbsp; Tap to add your signature</div></div></div></div><div class="mt-4">${btn('Next','funded')}</div></div>${footer}`;break;
case'funded':h=`${step(4)}<div class="body center"><h1 class="title big mt-2">Your <span class="blue">${money(S.amount)}</span> has been<br>sent to your bank<br>account.</h1><p class="mt-4">Your loan proceeds are being deposited into your Checking account. Funds are typically received within one (1) to three (3) business days.<br>Please make sure you download your documents below.</p><div class="download mt-5"><span class="doc-icon"><i class="bi bi-file-earmark-text"></i></span><span>Direct Installment Loan<br>Disclosure Note</span><button class="download-action" aria-label="Download disclosure"><i class="bi bi-download"></i></button></div><div class="download"><span class="doc-icon"><i class="bi bi-file-earmark-text"></i></span><span>Credit Score Disclosure</span><button class="download-action" aria-label="Download credit score disclosure"><i class="bi bi-download"></i></button></div><div class="cardbox center mt-5"><div class="d-flex align-items-center justify-content-center gap-3"><img src="https://myloan.regionalfinance.com/images/regional/RMC_Logo.png" alt="Regional Finance" style="width:48px"><span class="fs-5">Regional Finance Portal</span></div><div class="mt-4">${btn('Login','blank')}</div></div></div>${footer}`;break;}
app.innerHTML=h;document.querySelector('.phone').classList.toggle('offer-landing',S.page==='offerCode');wire();if(shouldScroll)scrollPrototypeTop()}
function bankModal(content){return `<div class="bankoverlay"><div class="bankmodal"><span class="x" data-go="bankIntro">×</span><div class="center">${content}</div></div></div>`}
function go(p,push=true){if(p==='credit'&&S.page!=='bankSuccess')p='bankIntro';if(push)S.hist.push(S.page);if(S.page==='sms')S.sms=true;if(S.page==='emailOtp')S.email=true;if(S.page==='bankSuccess')S.bank=true;S.page=p;render()}function start(f){S.flow=f;S.hist=[];S.sms=false;S.email=false;S.bank=false;S.emailAddr=f==='unknown'?'':'Testuser@gmail.com';S.amount=15000;S.term=5;S.autopay=false;S.offerOpen=null;S.customer=f==='unknown'?newCustomer():knownCustomer();document.querySelectorAll('[data-flow]').forEach(b=>b.classList.toggle('active',b.dataset.flow===f));panel.classList.remove('open');go(f==='known'?'confirmPhone':f==='unknown'?'known1':'offerCode',false)}function reset(){S={page:'blank',hist:[],sms:false,email:false,bank:false,flow:null,amount:15000,term:5,autopay:false,offerOpen:null,emailAddr:'',customer:newCustomer()};panel.classList.remove('open');render()}
function digits(v,n){return v.replace(/\D/g,'').slice(0,n)}function wire(){app.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{const email=app.querySelector('#emailInput');if(email)S.emailAddr=email.value.trim();go(x.dataset.go)});app.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>start(x.dataset.start));app.querySelectorAll('.boxcheck').forEach(x=>x.onclick=()=>x.classList.toggle('checked'));app.querySelectorAll('[data-bind]').forEach(x=>x.addEventListener('input',()=>S.customer[x.dataset.bind]=x.value));app.querySelectorAll('input[name="homeowner"]').forEach(x=>x.onchange=()=>S.customer.homeowner=x.value);
app.querySelectorAll('[data-format="name"]').forEach(x=>x.onblur=()=>{x.value=x.value.trim().toLowerCase().replace(/(^|[\s'-])\p{L}/gu,m=>m.toUpperCase());S.customer[x.dataset.bind]=x.value});app.querySelectorAll('[data-format="date"]').forEach(x=>x.oninput=()=>{const d=digits(x.value,8);x.value=[d.slice(0,2),d.slice(2,4),d.slice(4)].filter(Boolean).join(' / ');S.customer[x.dataset.bind]=x.value});app.querySelectorAll('[data-format="phone"]').forEach(x=>x.oninput=()=>{const d=digits(x.value,10);x.value=d.length>6?`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`:d.length>3?`${d.slice(0,3)}-${d.slice(3)}`:d;S.customer[x.dataset.bind]=x.value});app.querySelectorAll('[data-format="currency"]').forEach(x=>x.oninput=()=>{const d=digits(x.value,12);x.value=d?`$${Number(d).toLocaleString('en-US')}`:'';S.customer[x.dataset.bind]=d});app.querySelectorAll('[data-format="ssn"]').forEach(x=>{let timer;x.oninput=()=>{clearTimeout(timer);x.type='text';const d=digits(x.value,9);x.value=d.length>5?`${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}`:d.length>3?`${d.slice(0,3)}-${d.slice(3)}`:d;S.customer[x.dataset.bind]=d;timer=setTimeout(()=>x.type='password',1200)};x.onblur=()=>{clearTimeout(timer);x.type='password'}});
const address=app.querySelector('#addressInput'),menu=app.querySelector('#addressMenu');if(address&&menu){const show=()=>menu.classList.toggle('show',address.value.length>0);address.oninput=()=>{S.customer.address=address.value;show()};address.onfocus=show;menu.querySelectorAll('[data-address]').forEach(b=>b.onclick=()=>{address.value=b.dataset.address;S.customer.address=b.dataset.address;menu.classList.remove('show')})}
const fields=[...app.querySelectorAll('.otp input')];fields.forEach((x,i)=>x.oninput=()=>fields[i+1]?.focus());const note=app.querySelector('#iosNote'),smsPrefill=app.querySelector('#smsPrefill');let smsCodeFilled=false;const fillSmsCode=()=>{if(smsCodeFilled)return;smsCodeFilled=true;const code='429833';fields.forEach((field,i)=>setTimeout(()=>{field.value=code[i];field.dispatchEvent(new Event('input'));if(i===5)setTimeout(()=>note?.classList.remove('show'),650)},i*110))};if(note)setTimeout(()=>{if(note.isConnected)note.classList.add('show')},850);if(smsPrefill)smsPrefill.onclick=fillSmsCode
const showPass=app.querySelector('#showBankPassword'),bankPass=app.querySelector('#bankPassword');if(showPass&&bankPass)showPass.onclick=()=>{const visible=bankPass.type==='text';bankPass.type=visible?'password':'text';showPass.innerHTML=`<i class="bi bi-eye${visible?'':'-slash'}"></i>`};if(S.page==='bankConnecting'){const steps=[...app.querySelectorAll('[data-connect-step]')];steps.forEach((step,i)=>setTimeout(()=>{if(!step.isConnected)return;steps.slice(0,i).forEach(s=>{s.classList.remove('active');s.classList.add('done');s.querySelector('i').className='bi bi-check-lg'});step.classList.add('active');if(i===steps.length-1)setTimeout(()=>{step.classList.remove('active');step.classList.add('done');step.querySelector('i').className='bi bi-check-lg';setTimeout(()=>S.page==='bankConnecting'&&go('bankSuccess'),550)},700)},i*700))}
app.querySelectorAll('[data-offer-toggle]').forEach(x=>x.onclick=()=>{S.offerOpen=S.offerOpen===x.dataset.offerToggle?null:x.dataset.offerToggle;render(false)});app.querySelectorAll('[data-amount-step]').forEach(x=>x.onclick=()=>{S.amount=Math.max(1000,Math.min(15000,S.amount+Number(x.dataset.amountStep)));render(false)});const amountRange=app.querySelector('#amountRange');if(amountRange){amountRange.oninput=()=>S.amount=Math.min(15000,Math.max(1000,Number(amountRange.value)));amountRange.onchange=()=>render(false)}app.querySelectorAll('[data-term]').forEach(x=>x.onclick=()=>{S.term=Number(x.dataset.term);render(false)});const toggle=app.querySelector('.toggle');if(toggle){const flip=()=>{S.autopay=!S.autopay;toggle.classList.toggle('on',S.autopay);toggle.setAttribute('aria-checked',String(S.autopay))};toggle.onclick=flip;toggle.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}}}app.querySelectorAll('[data-account]').forEach(a=>a.onclick=()=>{app.querySelectorAll('[data-account]').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')})}
const panel=document.querySelector('.panel'),fab=document.createElement('button');fab.className='flow-fab';fab.type='button';fab.setAttribute('aria-label','Change demo flow');fab.setAttribute('aria-expanded','false');fab.innerHTML='<i class="bi bi-gear-fill" aria-hidden="true"></i>';panel.prepend(fab);fab.onclick=()=>{const open=panel.classList.toggle('open');fab.setAttribute('aria-expanded',String(open))};
document.querySelectorAll('[data-flow]').forEach(x=>x.onclick=()=>start(x.dataset.flow));document.querySelector('#reset').onclick=reset;render();
</script></body></html>
